name: Cache NASA Moon data (2019–2026)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_nasa_moon.py'
      - '.github/workflows/fetch-moon-data.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate annual NASA lunar datasets
        run: python3 scripts/fetch_nasa_moon.py
      - name: Commit downloaded datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moon/
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified NASA lunar records for 2019–2026"
            git push
          fi
